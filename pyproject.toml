[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automated-ai-code-evaluator"
version = "0.1.0"
description = "A small, reproducible Python code evaluator and Pytest generator"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pytest>=8,<10"]

[project.scripts]
ai-evaluator = "ai_evaluator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

